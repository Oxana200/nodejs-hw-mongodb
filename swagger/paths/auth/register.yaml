post:
  tags:
    - Auth
  summary: Реєстрація нового користувача
  operationId: registerUser
  description: Створює нового користувача.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              example: user@example.com
            password:
              type: string
              minLength: 6
              example: secret123
  responses:
    '201':
      description: Користувач успішно створений
    '409':
      description: Користувач з таким email вже існує
