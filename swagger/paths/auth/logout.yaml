tags:
  - Auth
summary: Logout user
operationId: logoutUser
description: Logout user by deleting the refresh token session.
security:
  - bearerAuth: []
responses:
  '204':
    description: Logged out successfully
  '400':
    description: Missing refresh token in cookies
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
  '401':
    description: Invalid or expired refresh token
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
