tags:
  - Auth
summary: Send reset password email
operationId: sendResetEmail
description: Sends an email with a reset password link.
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../components/schemas/EmailInput.yaml
responses:
  '200':
    description: Reset email sent successfully
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/SuccessMessage.yaml
  '400':
    description: Invalid request body (validation error)
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
  '404':
    description: User not found
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
  '500':
    description: Failed to send email
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
