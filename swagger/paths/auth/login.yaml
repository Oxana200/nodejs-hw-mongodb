tags:
  - Auth
summary: Login user
operationId: loginUser
description: Login with email and password. Returns access and refresh tokens.
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../components/schemas/LoginInput.yaml
responses:
  '200':
    description: Login successful
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/AuthTokens.yaml
  '400':
    description: Invalid request body (validation error)
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
  '401':
    description: Invalid credentials
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
