post:
  tags:
    - Auth
  summary: Вхід користувача
  operationId: loginUser
  description: Авторизація користувача за email і паролем.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              example: user@example.com
            password:
              type: string
              example: secret123
  responses:
    '200':
      description: Успішна авторизація. Повертає токен.
    '401':
      description: Невірні облікові дані
