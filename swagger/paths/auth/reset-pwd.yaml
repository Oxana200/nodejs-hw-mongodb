tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: Reset password using a valid token.
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../components/schemas/ResetPasswordInput.yaml
responses:
  '200':
    description: Password reset successful
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/SuccessMessage.yaml
  '400':
    description: Invalid request body (validation error)
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
  '401':
    description: Token is expired or invalid
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
  '404':
    description: User not found
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
