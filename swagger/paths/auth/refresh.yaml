post:
  tags:
    - Auth
  summary: Оновити сесію
  operationId: refreshSession
  description: Повертає новий access токен, якщо refresh токен валідний.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Новий access токен
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken:
                type: string
                example: your.new.jwt.token
    '401':
      description: Refresh токен недійсний або відсутній
