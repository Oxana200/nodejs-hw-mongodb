tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact for the authenticated user. Optional photo can be uploaded.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: ../../components/schemas/CreateContactInput.yaml
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ContactResponse.yaml
  '400':
    description: Invalid request body or validation error
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
  '401':
    description: Unauthorized (missing or invalid token)
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
