get:
  tags:
    - Contacts
  summary: Отримати контакт за ID
  operationId: getContactById
  description: Отримати детальну інформацію про контакт по його унікальному ідентифікатору.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: Унікальний ідентифікатор контакту
      schema:
        type: string
  responses:
    '200':
      description: Успішна відповідь. Контакт знайдено.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Contact'
    '404':
      description: Контакт не знайдено
