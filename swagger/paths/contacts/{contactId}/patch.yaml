patch:
  tags:
    - Contacts
  summary: Оновити контакт
  operationId: updateContact
  description: Оновлення існуючого контакту за ID.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: Унікальний ідентифікатор контакту
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Contact'
  responses:
    '200':
      description: Контакт оновлено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Contact'
    '404':
      description: Контакт не знайдено
