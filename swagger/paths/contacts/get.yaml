tags:
  - Contacts
summary: Get all contacts for the current user
operationId: getAllContacts
description: Retrieve a paginated list of contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      default: 10
responses:
  '200':
    description: Contacts retrieved successfully
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ContactsListResponse.yaml
  '400':
    description: Invalid query parameters
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
  '401':
    description: Unauthorized (missing or invalid token)
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
